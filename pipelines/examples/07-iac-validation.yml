trigger: none

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
  - bash: |
      set -euo pipefail
      terraform -chdir=examples/week-09/terraform fmt -check -recursive
      terraform -chdir=examples/week-09/terraform init -backend=false
      terraform -chdir=examples/week-09/terraform validate
    displayName: Validate Terraform without applying
