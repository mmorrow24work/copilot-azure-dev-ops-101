trigger: none

pool:
  vmImage: ubuntu-latest

stages:
  - stage: DeployDev
    displayName: Deploy to training development
    jobs:
      - deployment: DeployGreeting
        environment: training-dev
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - bash: |
                    set -euo pipefail
                    mkdir -p "$(Pipeline.Workspace)/deployed"
                    cp src/greeting.py "$(Pipeline.Workspace)/deployed/"
                    sha256sum "$(Pipeline.Workspace)/deployed/greeting.py"
                  displayName: Simulate deployment and record checksum
