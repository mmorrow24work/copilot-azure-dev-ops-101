# Azure Repos queues this YAML through a build-validation branch policy.
# Do not add a pr: block for an Azure Repos Git repository.
trigger: none

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
    clean: true
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.11'
  - script: python -m pip install -r requirements-dev.txt
    displayName: Install dependencies
  - script: pytest -q --junitxml=$(Common.TestResultsDirectory)/pytest.xml
    displayName: Validate pull request
  - task: PublishTestResults@2
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: $(Common.TestResultsDirectory)/pytest.xml
      failTaskOnFailedTests: true
