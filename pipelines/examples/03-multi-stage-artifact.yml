trigger:
  branches:
    include: [main]

pool:
  vmImage: ubuntu-latest

stages:
  - stage: Build
    jobs:
      - job: Package
        steps:
          - checkout: self
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.11'
          - script: |
              python -m pip install build
              python -m build
            displayName: Build wheel and source distribution
          - publish: $(Build.SourcesDirectory)/dist
            artifact: python-package

  - stage: Validate
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: TestArtifact
        steps:
          - download: current
            artifact: python-package
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.11'
          - script: |
              python -m pip install $(Pipeline.Workspace)/python-package/*.whl
              python -c "from src.greeting import greeting; assert greeting('Pipeline') == 'Hello, Pipeline!'"
            displayName: Install and smoke-test artifact
